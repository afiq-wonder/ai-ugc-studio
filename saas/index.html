<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI UGC Studio SaaS Shell v0.1</title><style>:root{--bg:#0b0d12;--panel:#121620;--line:#283044;--text:#f7f8fb;--muted:#9aa4b2;--accent:#7c5cff;--danger:#ff6b6b;--good:#35c78a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.badge{border:1px solid var(--line);border-radius:999px;padding:8px 12px;color:#cec7ff}.grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:24px}.card h1,.card h2{margin-top:0}.muted{color:var(--muted);line-height:1.55}.form{display:grid;gap:12px;margin-top:18px}input{width:100%;background:#0f131b;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:13px;font:inherit}button{border:0;border-radius:12px;padding:13px 16px;font:inherit;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:white}.secondary{background:#1b2231;color:white;border:1px solid var(--line)}.error{color:#ff9b9b;margin-top:12px;min-height:20px}.success{color:#7ee2b8;margin-top:12px;min-height:20px}.gate{min-height:420px;display:grid;place-items:center;text-align:center}.locked{max-width:520px}.status{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);padding:8px 11px;border-radius:999px;color:var(--muted);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--danger)}.status.ok .dot{background:var(--good)}iframe{width:100%;height:760px;border:0;border-radius:18px;background:white}.hidden{display:none}.mode{display:flex;gap:8px;margin-top:18px}.mode button{flex:1}.mode .active{background:var(--accent);color:white;border-color:transparent}@media(max-width:800px){.grid{grid-template-columns:1fr}.wrap{padding:14px}}</style></head><body><main class="wrap"><div class="top"><div><strong>AI UGC Studio</strong><div class="muted">SaaS Shell v0.1</div></div><div class="badge">Supabase Auth</div></div><div class="grid"><section class="card"><h1 id="authTitle">Welcome back</h1><p class="muted" id="authCopy">Sign in to access your private AI UGC Studio workspace.</p><div class="status" id="providerPill"><span class="dot"></span><span id="providerStatus">Checking authentication provider…</span></div><div class="mode"><button class="secondary active" id="signInMode" type="button">Sign in</button><button class="secondary" id="signUpMode" type="button">Create account</button></div><form class="form" id="loginForm"><input id="email" type="email" autocomplete="email" placeholder="Email" required><input id="password" type="password" autocomplete="current-password" placeholder="Password" minlength="6" required><button class="primary" id="submitAuth" type="submit">Sign in</button></form><button class="secondary hidden" id="signOut" type="button" style="margin-top:12px">Sign out</button><div class="error" id="error"></div><div class="success" id="success"></div></section><section class="card gate"><div class="locked" id="locked"><h2>Workspace locked</h2><p class="muted">The Director remains inaccessible until Supabase verifies an authenticated session.</p></div><div id="workspace" class="hidden" style="width:100%"><h2>Workspace</h2><p class="muted" id="sessionLabel">Authenticated session verified.</p><iframe src="../index.html" title="AI UGC Studio Director"></iframe></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-auth-provider.js"></script><script src="./auth-adapter.js"></script><script>const q=s=>document.querySelector(s),status=q('#providerStatus'),pill=q('#providerPill'),error=q('#error'),success=q('#success'),form=q('#loginForm'),out=q('#signOut'),locked=q('#locked'),workspace=q('#workspace'),title=q('#authTitle'),copy=q('#authCopy'),submit=q('#submitAuth'),signInMode=q('#signInMode'),signUpMode=q('#signUpMode'),sessionLabel=q('#sessionLabel');let mode='signin';function setMode(next){mode=next;const signup=mode==='signup';signInMode.classList.toggle('active',!signup);signUpMode.classList.toggle('active',signup);title.textContent=signup?'Create your account':'Welcome back';copy.textContent=signup?'Create an account to access your private AI UGC Studio workspace.':'Sign in to access your private AI UGC Studio workspace.';submit.textContent=signup?'Create account':'Sign in';q('#password').autocomplete=signup?'new-password':'current-password';error.textContent='';success.textContent=''}function render(session){const ok=Boolean(session&&session.user);locked.classList.toggle('hidden',ok);workspace.classList.toggle('hidden',!ok);form.classList.toggle('hidden',ok);q('.mode').classList.toggle('hidden',ok);out.classList.toggle('hidden',!ok);if(ok)sessionLabel.textContent=`Signed in as ${session.user.email||'authenticated user'}.`}async function boot(){const info=AIUGCAuth.getProviderInfo();const configured=info.configured;status.textContent=configured?`Auth provider: ${info.name}`:'Auth provider not configured';pill.classList.toggle('ok',configured);try{render(await AIUGCAuth.getSession())}catch(e){error.textContent=e.message;render(null)}}signInMode.addEventListener('click',()=>setMode('signin'));signUpMode.addEventListener('click',()=>setMode('signup'));form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';success.textContent='';const credentials={email:q('#email').value.trim(),password:q('#password').value};try{if(mode==='signup'){const result=await AIUGCAuth.signUp(credentials);if(result&&result.session){render(result.session)}else{success.textContent='Account created. Check your email for the confirmation link, then sign in.'}}else{const session=await AIUGCAuth.signIn(credentials);render(session)}}catch(err){error.textContent=err.message;render(null)}});out.addEventListener('click',async()=>{error.textContent='';success.textContent='';try{await AIUGCAuth.signOut();render(null)}catch(err){error.textContent=err.message}});addEventListener('aiugc:auth',e=>render(e.detail));setMode('signin');boot();</script></body></html>
